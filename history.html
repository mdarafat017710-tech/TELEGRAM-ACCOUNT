<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Telegram Account Setup - iOS Style</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --accent-blue: #007aff;
      --accent-green: #34c759;
      --accent-red: #ff3b30;
      --text-main: #000000;
      --text-muted: #8e8e93;
      --border-color: #c6c6c8;
      --divider-color: #e5e5ea;
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .top-nav {
      width: 100%;
      max-width: 420px;
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      position: relative;
      height: 36px;
    }

    .back-btn {
      background: transparent;
      border: none;
      width: 36px;
      height: 32px;
      display: none;
      align-items: center;
      justify-content: flex-start;
      cursor: pointer;
      color: var(--accent-blue);
      padding: 0;
    }

    .back-btn.show {
      display: flex;
    }

    .header-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.4px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .step-container {
      width: 100%;
      max-width: 420px;
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .step-container.active {
      display: flex;
    }

    .info-box-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .box-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.2px;
      padding-left: 2px;
    }

    /* iOS Country Selector Field */
    .country-selector-btn {
      width: 100%;
      padding: 12px 14px;
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      font-size: 15px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    .country-selector-btn:active {
      background: #f8f8f9;
    }

    .selector-text {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }

    .selector-text.placeholder {
      color: var(--text-muted);
    }

    /* Unified Phone Input Box */
    .unified-phone-wrapper {
      position: relative;
      width: 100%;
    }

    .unified-phone-box {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 0 40px 0 0;
      height: 48px;
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .unified-phone-box:focus-within {
      border-color: var(--accent-blue);
      box-shadow: 0 0 10px rgba(0, 122, 255, 0.25);
    }

    .unified-phone-box.valid {
      border-color: var(--accent-green) !important;
      box-shadow: 0 0 10px rgba(52, 199, 89, 0.25) !important;
    }

    .unified-phone-box.invalid {
      border-color: var(--accent-red) !important;
      box-shadow: 0 0 10px rgba(255, 59, 48, 0.25) !important;
    }

    .code-input {
      width: 65px;
      height: 100%;
      border: none;
      outline: none;
      padding: 0 8px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      background: transparent;
      text-align: center;
      user-select: text;
      -webkit-user-select: text;
    }

    .v-divider {
      width: 1px;
      height: 24px;
      background-color: var(--border-color);
      flex-shrink: 0;
    }

    .number-input {
      flex: 1;
      height: 100%;
      border: none;
      outline: none;
      padding: 0 12px;
      font-size: 15px;
      color: var(--text-main);
      background: transparent;
      user-select: text;
      -webkit-user-select: text;
    }

    /* Standard Box */
    .ios-box {
      width: 100%;
      height: 48px;
      padding: 0 42px 0 14px;
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      font-size: 15px;
      color: var(--text-main);
      outline: none;
      transition: all 0.3s ease;
      user-select: text;
      -webkit-user-select: text;
    }

    .ios-box:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 10px rgba(0, 122, 255, 0.25);
    }

    .ios-box.valid {
      border-color: var(--accent-green) !important;
      box-shadow: 0 0 10px rgba(52, 199, 89, 0.25) !important;
    }

    .ios-box.invalid {
      border-color: var(--accent-red) !important;
      box-shadow: 0 0 10px rgba(255, 59, 48, 0.25) !important;
    }

    .input-indicator {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      background: var(--accent-green);
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .input-indicator.show {
      display: flex;
    }

    /* Proceed Button */
    .action-container {
      width: 100%;
      max-width: 420px;
      margin-top: 8px;
    }

    .btn-proceed {
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      width: 100%;
      height: 46px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2);
      transition: all 0.2s ease;
    }

    .btn-proceed:disabled {
      background: #c6c6c8;
      color: #8e8e93;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .ios-spinner {
      display: none;
      width: 18px;
      height: 18px;
      animation: iosRotate 0.8s steps(8, end) infinite;
    }

    @keyframes iosRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Confirmation Card */
    .account-card {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--border-color);
      padding: 4px 14px 14px;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 420px;
    }

    .field-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 14px 0;
      border-bottom: 0.5px solid var(--divider-color);
    }

    .field-item:last-child {
      border-bottom: none;
    }

    .field-left {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .field-right-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .field-right {
      font-size: 14px;
      font-family: monospace, var(--font-family);
      color: #3a3a3c;
    }

    .copy-btn {
      background: #f0f0f5;
      color: var(--accent-blue);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .copy-btn.copied {
      background: var(--accent-green) !important;
      color: #ffffff !important;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 14px;
      margin-top: 4px;
      border-top: 0.5px solid var(--divider-color);
    }

    .action-btn-confirm {
      background: var(--accent-blue);
      color: #ffffff;
      width: 100%;
      border: none;
      height: 46px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2);
    }

    /* iOS Country Search Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      height: 85vh;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      overflow: hidden;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 0.5px solid var(--divider-color);
    }

    .modal-title {
      font-size: 17px;
      font-weight: 600;
    }

    .modal-close-btn {
      background: #e5e5ea;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #8e8e93;
      font-weight: bold;
    }

    .search-box-wrapper {
      padding: 10px 16px;
      background: #f2f2f7;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px 10px 36px;
      background: #e3e3e8;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .search-input-container {
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .country-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px;
    }

    .country-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 0.5px solid var(--divider-color);
      cursor: pointer;
    }

    .country-item:active {
      background: #f8f8f9;
    }

    .country-left {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
    }

    .country-code-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Toast Notification */
    #copy-toast {
      position: fixed;
      top: -70px;
      left: 50%;
      transform: translateX(-50%);
      background: #000000;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
      transition: top 0.35s ease;
      pointer-events: none;
    }

    #copy-toast.show {
      top: 16px;
    }
  </style>
</head>
<body>

  <!-- Toast Popup -->
  <div id="copy-toast">
    <div style="width:16px; height:16px; background:var(--accent-green); border-radius:50%; display:inline-flex; align-items:center; justify-content:center;">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <span>Copied successfully!</span>
  </div>

  <!-- Top Bar -->
  <div class="top-nav">
    <button class="back-btn" id="back-btn-elem" onclick="goBackStep()">
      <svg width="24" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>
    <h1 class="header-title" id="main-title">Submit Telegram Account</h1>
  </div>

  <!-- Step 1: Phone Number (with Country Code) -->
  <div id="step-1" class="step-container active">
    <div class="info-box-group">
      <label class="box-label">Select Country Code</label>
      <div class="country-selector-btn" onclick="openCountryModal()">
        <span class="selector-text placeholder" id="selected-country-text">Select Country Code</span>
        <svg width="12" height="12" viewBox="0 0 292.4 292.4" fill="#8e8e93"><path d="M287 69.4a17.6 17.6 0 0 0-13-5.4H18.4c-5 0-9.3 1.8-12.9 5.4A17.6 17.6 0 0 0 0 82.2c0 5 1.8 9.3 5.4 12.9l128 127.9c3.6 3.6 7.8 5.4 12.8 5.4s9.2-1.8 12.8-5.4L287 95c3.5-3.5 5.4-7.8 5.4-12.8 0-5-1.9-9.2-5.5-12.8z"/></svg>
      </div>
    </div>

    <div class="info-box-group">
      <label class="box-label">Phone Number</label>
      <div class="unified-phone-wrapper">
        <div class="unified-phone-box" id="phone-box-container">
          <input type="text" id="input-code" class="code-input" placeholder="+" maxlength="5" oninput="handleCodeTyping()" onpaste="handlePhonePaste(event)">
          <div class="v-divider"></div>
          <input type="tel" id="input-number" class="number-input" placeholder="Phone Number" oninput="validatePhoneStep()" onkeydown="handleNumberKeyDown(event)" onpaste="handlePhonePaste(event)">
        </div>
        <div class="input-indicator" id="phone-indicator">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
      </div>
    </div>

    <div class="action-container">
      <button class="btn-proceed" id="btn-1" disabled onclick="nextStep(1)">
        <span id="btn-text-1">Proceed</span>
        <svg class="ios-spinner" id="spinner-1" viewBox="0 0 24 24">
          <line x1="12" y1="3" x2="12" y2="6" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="1"/>
          <line x1="18.36" y1="5.64" x2="16.24" y2="7.76" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.875"/>
          <line x1="21" y1="12" x2="18" y2="12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
          <line x1="18.36" y1="18.36" x2="16.24" y2="16.24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.625"/>
          <line x1="12" y1="21" x2="12" y2="18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
          <line x1="5.64" y1="18.36" x2="7.76" y2="16.24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.375"/>
          <line x1="3" y1="12" x2="6" y2="12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.25"/>
          <line x1="5.64" y1="5.64" x2="7.76" y2="7.76" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.125"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Step 2: Email Address -->
  <div id="step-2" class="step-container">
    <div class="info-box-group">
      <label class="box-label">Your Email Address</label>
      <div style="position: relative; width: 100%;">
        <input type="email" id="input-email" class="ios-box" placeholder="Enter email address" oninput="validateEmailStep()">
        <div class="input-indicator" id="email-indicator">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
      </div>
    </div>
    <div class="action-container">
      <button class="btn-proceed" id="btn-2" disabled onclick="nextStep(2)">
        <span id="btn-text-2">Proceed</span>
        <svg class="ios-spinner" id="spinner-2" viewBox="0 0 24 24">
          <line x1="12" y1="3" x2="12" y2="6" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="1"/>
          <line x1="18.36" y1="5.64" x2="16.24" y2="7.76" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.875"/>
          <line x1="21" y1="12" x2="18" y2="12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
          <line x1="18.36" y1="18.36" x2="16.24" y2="16.24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.625"/>
          <line x1="12" y1="21" x2="12" y2="18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
          <line x1="5.64" y1="18.36" x2="7.76" y2="16.24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.375"/>
          <line x1="3" y1="12" x2="6" y2="12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.25"/>
          <line x1="5.64" y1="5.64" x2="7.76" y2="7.76" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.125"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Step 3: Final Confirmation Card -->
  <div id="step-3" class="step-container">
    <div class="account-card" id="confirmation-card-content"></div>
  </div>

  <!-- iOS Country Selector Search Modal -->
  <div class="modal-overlay" id="country-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Select Country</span>
        <button class="modal-close-btn" onclick="closeCountryModal()">✕</button>
      </div>
      <div class="search-box-wrapper">
        <div class="search-input-container">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="modal-search-input" class="search-input" placeholder="Search country or code..." oninput="filterCountryList()">
        </div>
      </div>
      <div class="country-list" id="modal-country-list">
        <!-- Rendered via JS -->
      </div>
    </div>
  </div>

  <script>
    const copyIconSVG = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;

      { flag: "🇧🇭", name: "Bahrain", code: "+973" },
      { flag: "🇹🇷", name: "Turkey", code: "+90" },
      { flag: "🇿🇦", name: "South Africa", code: "+27" },
      { flag: "🇪🇸", name: "Spain", code: "+34" },
      { flag: "🇳🇱", name: "Netherlands", code: "+31" },
      { flag: "🇸🇪", name: "Sweden", code: "+46" }
    ];

    let currentStep = 1;
    let formData = { phone: "", email: "" };

    function updateNavHeader() {
      const backBtn = document.getElementById('back-btn-elem');
      if (currentStep > 1 && currentStep <= 3) {
        backBtn.classList.add('show');
      } else {
        backBtn.classList.remove('show');
      }
    }

    function showToast() {
      const toast = document.getElementById('copy-toast');
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 2000);
    }

    function copyToClipboard(text, btnElement) {
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        btnElement.classList.add('copied');
        btnElement.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
        showToast();
        setTimeout(() => {
          btnElement.classList.remove('copied');
          btnElement.innerHTML = copyIconSVG;
        }, 2000);
      });
    }

    /* Modal Functions */
    function openCountryModal() {
      document.getElementById('country-modal').classList.add('active');
      document.getElementById('modal-search-input').value = "";
      renderCountryList(countries);
    }

    function closeCountryModal() {
      document.getElementById('country-modal').classList.remove('active');
    }

    function renderCountryList(list) {
      const container = document.getElementById('modal-country-list');
      container.innerHTML = '';
      list.forEach(c => {
        const div = document.createElement('div');
        div.className = 'country-item';
        div.onclick = () => selectCountry(c);
        div.innerHTML = `
          <div class="country-left">
            <span>${c.flag}</span>
            <span>${c.name}</span>
          </div>
          <span class="country-code-text">${c.code}</span>
        `;
        container.appendChild(div);
      });
    }

    function filterCountryList() {
      const query = document.getElementById('modal-search-input').value.toLowerCase().trim();
      const filtered = countries.filter(c => 
        c.name.toLowerCase().includes(query) || c.code.toLowerCase().includes(query)
      );
      renderCountryList(filtered);
    }

    function selectCountry(c) {
      const label = document.getElementById('selected-country-text');
      label.textContent = `${c.flag} ${c.name} (${c.code})`;
      label.classList.remove('placeholder');

      const codeInput = document.getElementById('input-code');
      codeInput.value = c.code;

      closeCountryModal();
      document.getElementById('input-number').focus();
      validatePhoneStep();
    }

    /* Phone Input Handlers */
    function handleCodeTyping() {
      const codeInput = document.getElementById('input-code');
      let val = codeInput.value.trim();
      
      if (val !== "" && !val.startsWith("+")) {
        val = "+" + val;
        codeInput.value = val;
      }

      const match = countries.find(c => c.code === val);
      if (match) {
        const label = document.getElementById('selected-country-text');
        label.textContent = `${match.flag} ${match.name} (${match.code})`;
        label.classList.remove('placeholder');
        document.getElementById('input-number').focus();
      }

      validatePhoneStep();
    }

    function handleNumberKeyDown(e) {
      const numInput = document.getElementById('input-number');
      const codeInput = document.getElementById('input-code');
      if (e.key === "Backspace" && numInput.value === "") {
        codeInput.focus();
      }
    }

    function handlePhonePaste(e) {
      const clipboardData = e.clipboardData || window.clipboardData;
      if (!clipboardData) return;
      const pastedText = clipboardData.getData('text').trim();

      if (pastedText.startsWith("+") || /\d{8,}/.test(pastedText)) {
        e.preventDefault();
        let matchedCode = "";
        let remainingNum = pastedText;

        const sortedCountries = [...countries].sort((a, b) => b.code.length - a.code.length);
        for (let c of sortedCountries) {
          if (pastedText.startsWith(c.code)) {
            matchedCode = c.code;
            remainingNum = pastedText.slice(c.code.length).trim();
            break;
          }
        }

        if (!matchedCode && pastedText.startsWith("+")) {
          const match = pastedText.match(/^(\+\d{1,4})(.*)$/);
          if (match) {
            matchedCode = match[1];
            remainingNum = match[2].trim();
          }
        }

        const codeInput = document.getElementById('input-code');
        const numInput = document.getElementById('input-number');

        if (matchedCode) {
          codeInput.value = matchedCode;
          const selectMatch = countries.find(c => c.code === matchedCode);
          if (selectMatch) {
            const label = document.getElementById('selected-country-text');
            label.textContent = `${selectMatch.flag} ${selectMatch.name} (${selectMatch.code})`;
            label.classList.remove('placeholder');
          }
        }

        numInput.value = remainingNum.replace(/[^\d]/g, '');
        numInput.focus();
        validatePhoneStep();
      }
    }

    function validatePhoneStep() {
      const codeInput = document.getElementById('input-code');
      const numInput = document.getElementById('input-number');
      const box = document.getElementById('phone-box-container');
      const indicator = document.getElementById('phone-indicator');
      const btn = document.getElementById('btn-1');

      const codeVal = codeInput.value.trim();
      const numVal = numInput.value.trim().replace(/[^\d]/g, '');

      if (codeVal.startsWith("+") && codeVal.length >= 2 && numVal.length >= 6) {
        box.classList.remove('invalid');
        box.classList.add('valid');
        indicator.classList.add('show');
        btn.disabled = false;
      } else {
        if (codeVal.length > 0 || numVal.length > 0) {
          box.classList.remove('valid');
          box.classList.add('invalid');
        } else {
          box.classList.remove('valid', 'invalid');
        }
        indicator.classList.remove('show');
        btn.disabled = true;
      }
    }

    function validateEmailStep() {
      const input = document.getElementById('input-email');
      const indicator = document.getElementById('email-indicator');
      const btn = document.getElementById('btn-2');
      const val = input.value.trim().toLowerCase();

      if (val.includes("@") && val.includes(".") && val.length > 5) {
        input.classList.remove('invalid');
        input.classList.add('valid');
        indicator.classList.add('show');
        btn.disabled = false;
      } else {
        if (val.length > 0) {
          input.classList.remove('valid');
          input.classList.add('invalid');
        } else {
          input.classList.remove('valid', 'invalid');
        }
        indicator.classList.remove('show');
        btn.disabled = true;
      }
    }

    function nextStep(step) {
      if (step === 1) {
        const code = document.getElementById('input-code').value.trim();
        const num = document.getElementById('input-number').value.trim();
        formData.phone = `${code}${num}`;
      }
      if (step === 2) {
        formData.email = document.getElementById('input-email').value.trim();
        buildConfirmationCard();
        return;
      }

      const btnText = document.getElementById(`btn-text-${step}`);
      const spinner = document.getElementById(`spinner-${step}`);
      const btn = document.getElementById(`btn-${step}`);

      btnText.style.display = 'none';
      spinner.style.display = 'inline-block';
      btn.disabled = true;

      setTimeout(() => {
        spinner.style.display = 'none';
        btnText.style.display = 'inline';
        btn.disabled = false;

        document.getElementById(`step-${step}`).classList.remove('active');
        currentStep = step + 1;
        document.getElementById(`step-${currentStep}`).classList.add('active');
        updateNavHeader();
      }, 800);
    }

    function goBackStep() {
      if (currentStep > 1 && currentStep <= 3) {
        document.getElementById(`step-${currentStep}`).classList.remove('active');
        currentStep--;
        document.getElementById(`step-${currentStep}`).classList.add('active');
        updateNavHeader();
      }
    }

    function buildConfirmationCard() {
      const btnText = document.getElementById(`btn-text-2`);
      const spinner = document.getElementById(`spinner-2`);
      const btn = document.getElementById(`btn-2`);

      btnText.style.display = 'none';
      spinner.style.display = 'inline-block';
      btn.disabled = true;

      setTimeout(() => {
        spinner.style.display = 'none';
        btnText.style.display = 'inline';
        btn.disabled = false;

        document.getElementById('step-2').classList.remove('active');
        currentStep = 3;
        document.getElementById('step-3').classList.add('active');
        updateNavHeader();

        const container = document.getElementById('confirmation-card-content');
        container.innerHTML = `
          <div class="field-item">
            <span class="field-left">Phone Number</span>
            <div class="field-right-group">
              <span class="field-right">${escapeHtml(formData.phone)}</span>
              <button class="copy-btn" onclick="copyToClipboard('${escapeJs(formData.phone)}', this)">${copyIconSVG}</button>
            </div>
          </div>

          <div class="field-item">
            <span class="field-left">Email</span>
            <div class="field-right-group">
              <span class="field-right">${escapeHtml(formData.email)}</span>
              <button class="copy-btn" onclick="copyToClipboard('${escapeJs(formData.email)}', this)">${copyIconSVG}</button>
            </div>
          </div>

          <div class="card-actions">
            <button class="action-btn-confirm" onclick="submitFinalData()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Save Account
            </button>
          </div>
        `;
      }, 800);
    }

    function submitFinalData() {
      const payload = {
        action: "submit_telegram_account",
        phone: formData.phone,
        email: formData.email
      };

      const jsonString = JSON.stringify(payload);
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.sendData(jsonString);
      } else {
        alert("Account Saved Successfully!");
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    function escapeJs(str) {
      return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
    }
  </script>
</body>
</html>
