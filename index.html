<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Account Setup & Withdraw</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="copy-toast">
    <div class="toast-icon-wrapper">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <span id="toast-msg">Copied successfully!</span>
  </div>

  <div class="top-nav">
    <h1 class="header-title" id="main-title">Submit Account</h1>
  </div>

  <div id="tab-submit" class="tab-content active">
    <div id="step-1" class="step-container active">
      <div class="info-box-group">
        <label class="box-label">Your Email Address</label>
        <div class="input-wrapper">
          <input type="email" id="input-email" class="ios-box" placeholder="Enter email address" oninput="validateGmailField('email', 1)">
          <div class="input-indicator" id="email-indicator">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
        </div>
        <div class="field-error-msg" id="email-error-msg">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line></svg>
          <span>Email already submitted!</span>
        </div>
      </div>
      <div class="action-container">
        <button class="btn-proceed" id="btn-1" disabled onclick="nextStep(1)">
          <span>Proceed</span>
        </button>
      </div>
    </div>

    <div id="step-2" class="step-container">
      <div class="info-box-group">
        <label class="box-label">Your Account Password</label>
        <div class="input-wrapper">
          <input type="text" id="input-password" class="ios-box" placeholder="Enter account password" oninput="validateStandardField('password', 6, 2)">
          <div class="input-indicator" id="password-indicator">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
        </div>
      </div>
      <div class="action-container">
        <button class="btn-proceed" id="btn-2" disabled onclick="nextStep(2)">
          <span>Proceed</span>
        </button>
      </div>
    </div>

    <div id="step-3" class="step-container">
      <div class="info-box-group">
        <label class="box-label">Recovery Email</label>
        <div class="input-wrapper">
          <input type="email" id="input-recovery" class="ios-box" placeholder="Enter recovery email" oninput="validateGmailField('recovery', 3)">
          <div class="input-indicator" id="recovery-indicator">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
        </div>
        <div class="field-error-msg" id="recovery-error-msg">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line></svg>
          <span>Recovery email already submitted!</span>
        </div>
      </div>
      <div class="action-container">
        <button class="btn-proceed" id="btn-3" disabled onclick="nextStep(3)">
          <span>Proceed</span>
        </button>
      </div>
    </div>

    <div id="step-4" class="step-container">
      <div class="account-card" id="confirmation-card-content"></div>
    </div>
  </div>

  <div id="tab-submit-history" class="tab-content">
    <div class="search-container">
      <div class="search-box">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="gmail-search-input" placeholder="Search by email address..." oninput="handleGmailSearchInput()">
        <button class="clear-btn" id="gmail-clear-btn" onclick="clearGmailSearchInput()">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <button class="search-btn" id="gmail-search-btn" onclick="handleGmailSearch()">
        <span id="gmail-btn-text">Search</span>
        <svg id="gmail-btn-spinner" class="ios-spinner btn-spinner" viewBox="0 0 24 24">
          <line x1="12" y1="3" x2="12" y2="6" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="1"/>
          <line x1="18.36" y1="5.64" x2="16.24" y2="7.76" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.875"/>
          <line x1="21" y1="12" x2="18" y2="12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
          <line x1="18.36" y1="18.36" x2="16.24" y2="16.24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.625"/>
          <line x1="12" y1="21" x2="12" y2="18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
          <line x1="5.64" y1="18.36" x2="7.76" y2="16.24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.375"/>
          <line x1="3" y1="12" x2="6" y2="12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.25"/>
          <line x1="5.64" y1="5.64" x2="7.76" y2="7.76" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.125"/>
        </svg>
      </button>
    </div>
    <div id="gmail-history-container"></div>
  </div>

  <div id="tab-withdraw-history" class="tab-content">
    <div class="search-container">
      <div class="search-box">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="withdraw-search-input" placeholder="Search withdraw history..." oninput="handleWithdrawSearchInput()">
        <button class="clear-btn" id="withdraw-clear-btn" onclick="clearWithdrawSearchInput()">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <button class="search-btn" id="withdraw-search-btn" onclick="handleWithdrawSearch()">
        <span id="withdraw-btn-text">Search</span>
        <svg id="withdraw-btn-spinner" class="ios-spinner btn-spinner" viewBox="0 0 24 24">
          <line x1="12" y1="3" x2="12" y2="6" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="1"/>
          <line x1="18.36" y1="5.64" x2="16.24" y2="7.76" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.875"/>
          <line x1="21" y1="12" x2="18" y2="12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
          <line x1="18.36" y1="18.36" x2="16.24" y2="16.24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.625"/>
          <line x1="12" y1="21" x2="12" y2="18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
          <line x1="5.64" y1="18.36" x2="7.76" y2="16.24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.375"/>
          <line x1="3" y1="12" x2="6" y2="12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.25"/>
          <line x1="5.64" y1="5.64" x2="7.76" y2="7.76" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.125"/>
        </svg>
      </button>
    </div>
    <div id="withdraw-history-container"></div>
  </div>

  <div id="tab-withdraw" class="tab-content">
    <div class="user-profile-card">
      <img id="avatar" src="https://telegram.org/img/t_logo.png" class="user-avatar" alt="Avatar">
      <div class="user-info">
        <h3 id="username">User Name</h3>
        <div class="user-id-wrapper" onclick="copyUserId()">
          <span id="user-id">ID: 000000</span>
          <button class="user-id-copy-btn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
        </div>
      </div>
      <div class="balance-badge">
        <span>৳ <strong id="user-balance">0.00</strong></span>
      </div>
    </div>

    <div id="withdraw-step-1" class="withdraw-step active">
      <div class="payment-methods-grid">
        <div class="payment-card active" onclick="selectPaymentMethod('bKash', this)">
          <img src="https://raw.githubusercontent.com/shakil426/icon/main/bkash.png" alt="bKash" onerror="this.src='https://via.placeholder.com/30?text=bKash'">
          <span>bKash</span>
        </div>
        <div class="payment-card" onclick="selectPaymentMethod('Nagad', this)">
          <img src="https://raw.githubusercontent.com/shakil426/icon/main/nagad.png" alt="Nagad" onerror="this.src='https://via.placeholder.com/30?text=Nagad'">
          <span>Nagad</span>
        </div>
        <div class="payment-card" onclick="selectPaymentMethod('Rocket', this)">
          <img src="https://raw.githubusercontent.com/shakil426/icon/main/rocket.png" alt="Rocket" onerror="this.src='https://via.placeholder.com/30?text=Rocket'">
          <span>Rocket</span>
        </div>
      </div>
      <div class="action-container" style="margin-top:15px;">
        <button class="btn-proceed" onclick="nextWithdrawStep(2)">
          <span>Next</span>
        </button>
      </div>
    </div>

    <div id="withdraw-step-2" class="withdraw-step">
      <div class="info-box-group">
        <label class="box-label">Account Number</label>
        <div class="input-wrapper">
          <input type="tel" id="withdraw-phone" class="ios-box" placeholder="Enter phone number" oninput="validateWithdrawForm()">
          <div class="input-indicator" id="phone-indicator">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
        </div>
      </div>

      <div class="info-box-group" style="margin-top:10px;">
        <label class="box-label">Amount</label>
        <div class="input-wrapper">
          <input type="number" id="withdraw-amount" class="ios-box" placeholder="Enter amount" oninput="validateWithdrawForm()">
          <div class="input-indicator" id="amount-indicator">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
        </div>
        <div class="field-error-msg" id="withdraw-error-msg">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line></svg>
          <span>Insufficient balance or invalid amount!</span>
        </div>
      </div>

      <div class="action-container" style="margin-top:15px; display:flex; gap:10px;">
        <button class="btn-proceed" style="background:#e5e5ea; color:#000;" onclick="nextWithdrawStep(1)">Back</button>
        <button class="btn-proceed" id="btn-withdraw-submit" disabled onclick="handleWithdrawSubmit()">Submit</button>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchMainTab('submit', this)">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 5v14M5 12h14"></path></svg>
      <span>Submit</span>
    </div>
    <div class="nav-item" onclick="switchMainTab('submit-history', this)">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
      <span>Submit History</span>
    </div>
    <div class="nav-item" onclick="switchMainTab('withdraw-history', this)">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="12 8 12 12 14 14"></polyline><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.85.83 6.72 2.24"></path></svg>
      <span>Withdraw History</span>
    </div>
    <div class="nav-item" onclick="switchMainTab('withdraw', this)">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
      <span>Withdraw</span>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
